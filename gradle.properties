# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16.3

# Mod properties
mod_id=mapsyncer
mod_name=MapSyncer
# Plain semantic version. This is what goes into fabric.mod.json and plugin.yml, and
# what Fabric Loader and launchers such as Prism display, so it must stay valid SemVer.
# Release jars are named mapsyncer-rebuild-<minecraft_version>-<mod_version>-client.jar
# and -paper.jar, built from this and minecraft_version above.
mod_version=0.6.1
maven_group=com.mapsyncer
mod_authors=RuoChennn, ShanHe_YF
mod_description=Syncs server-side explored areas to client's Xaero World Map

# Dependencies
fabric_api_version=0.158.0+26.2

# Xaero's World Map version
xaero_worldmap_version=1.41.0

# Paper plugin properties
paperweight_version=2.0.0-beta.22
paper_dev_bundle=26.2.build.116-stable
paper_api_version=26.2
